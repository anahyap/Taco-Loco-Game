<!doctype html>
<html>
  <head>
    <title>Taco Loco</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="css/game.css" rel="stylesheet" />

    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/png" href="img/taco.png" />
  </head>

  <body>
    <div id="wrapper">
      <div id="content">
        <div id="leftside" class="col1">
          <h1>Taco Loco!</h1>

          <p id="greeting"></p>

          <p id="directions">
            Get your hot sauce ready! In Taco Loco, your only job is to satisfy
            a massive craving. Tacos are flying everywhere, and they won’t stay
            crunchy forever. Tap, click, and feast your way to a high score
            before the screen clears!
          </p>

          <div id="sectionA">
            <span id="score">0 Tacos</span>
            <span id="timer">30 seconds left!</span>
          </div>

          <button type="button" id="start_button">Start!</button>
        </div>

        <div id="gamespace"></div>
      </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script>
      // player name
      let gamer = prompt("Enter first name:");

      document.getElementById("greeting").innerHTML =
        `Get ready to go taco CRAZY, ${gamer}!`;

      // score and timer variables
      let score = 0;
      let secondsRemaining = 30;

      let timerInterval;
      let t;

      let imageCount = 0;

      // get taco size depending on screen size
      function getTacoSize() {
        if (window.innerWidth <= 600) {
          return 80;
        }

        return 120;
      }

      // get random x position
      function getX() {
        let tacoSize = getTacoSize();

        return Math.floor(Math.random() * ($("#gamespace").width() - tacoSize));
      }

      // get random y position
      function getY() {
        let tacoSize = getTacoSize();

        return Math.floor(
          Math.random() * ($("#gamespace").height() - tacoSize),
        );
      }

      // increase score
      function keepScore() {
        score++;

        $("#score").text(`${score} tacos`);
      }

      // countdown timer
      function reverseTimer() {
        timerInterval = setInterval(function () {
          if (secondsRemaining > 0) {
            secondsRemaining--;

            $("#timer").text(`${secondsRemaining} seconds left!`);
          } else {
            clearInterval(timerInterval);
            clearTimeout(t);

            $("#timer").text("Clean Your Dishes!");

            // remove tacos still on screen
            $(".taco-img").fadeOut(300, function () {
              $(this).remove();
            });

            // show score
            setTimeout(function () {
              alert(`I bet you're full! You ate ${score} tacos, ${gamer}!`);

              resetGame();
            }, 500);
          }
        }, 1000);
      }

      // reset game
      function resetGame() {
        score = 0;
        secondsRemaining = 30;
        imageCount = 0;

        $("#score").text("0 Tacos");
        $("#timer").text("30 seconds left!");
        $("#timer").hide();

        $("#start_button").prop("disabled", false).text("Start!");
      }

      // start game
      function start() {
        $("#start_button").prop("disabled", true).text("Go!");

        reverseTimer();

        $("#timer").show();

        addImage();
      }

      // add taco
      function addImage() {
        let x = getX();
        let y = getY();

        // tacos appear faster as score increases
        let randomTime = Math.max(200, 800 - score * 30);

        // taco stays visible between 1 and 4 seconds
        let randomRemoveTime = Math.floor(Math.random() * 3000) + 1000;

        imageCount++;

        let tacoId = "taco-" + imageCount;

        $("#gamespace").append(
          `<img
                    src="img/taco.png"
                    alt="taco"
                    class="taco-img"
                    id="${tacoId}"
                    style="left:${x}px; top:${y}px;"
                >`,
        );

        // automatically remove taco after random amount of time
        setTimeout(function () {
          $("#" + tacoId).fadeOut(300, function () {
            $(this).remove();
          });
        }, randomRemoveTime);

        // create another taco
        t = setTimeout(addImage, randomTime);
      }

      $(document).ready(function () {
        $("#timer").hide();

        // start game
        $("#start_button").on("click", function () {
          start();
        });

        // taco click
        $("#gamespace").on("click", ".taco-img", function () {
          keepScore();

          let taco = $(this);

          let tacoX = taco.position().left;
          let tacoY = taco.position().top;

          // create +1 animation
          let points = $(
            `<span
                            class="points-popup"
                            style="left:${tacoX}px; top:${tacoY}px;"
                        >
                            +1
                        </span>`,
          );

          $("#gamespace").append(points);

          // make taco pop away
          taco.addClass("taco-eaten");

          // remove taco
          setTimeout(function () {
            taco.remove();
          }, 400);

          // remove +1
          setTimeout(function () {
            points.remove();
          }, 700);
        });
      });
    </script>
  </body>
</html>
