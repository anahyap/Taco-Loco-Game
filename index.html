</div>

<script>
// random number generator outside of document ready
// get random x position within gamespace
function getX() {
return Math.floor(Math.random() * ($("#gamespace").width() - 120));
}

// get random y position within gamespace
function getY() {
return Math.floor(Math.random() * ($("#gamespace").height() - 120));
}

// score increment function
let score = 0;
let secondsRemaining = 30;

// update score and store score by incrementing by 1
function keepScore() {
score++
$("span#score").text(`${score} tacos`);
}

// timer

let timerInterval;

// countdown timer counts down backwards from 30 until 0
function reverseTimer() {
  timerInterval = setInterval(function() {
    if (secondsRemaining > 0) {
      secondsRemaining--;
      $("#timer").text(`${secondsRemaining} seconds left!`);
    } else {
      // stop the timer and tacos
      clearInterval(timerInterval);
      clearTimeout(t);
      $("#timer").text("Clean Your Dishes!");
      
      // remove all left over tacos and disable clicking
      $(".taco-img").fadeOut(300, function() {
          $(this).remove();
      });
      $("#gamespace").off("click");
      
      // showcase final score and reset the game
      setTimeout(function() {
          alert(`I bet you're full! You ate ${score} tacos, ${gamer}!`);
          resetGame();
      }, 500);
    }
  }, 1000);
}


// resets the game
function resetGame() {
    score = 0;
    secondsRemaining = 30;
    $("span#score").text("0 Tacos");
    $("#timer").text("30 seconds left!");
    $("#timer").hide();
    imageCount = 0;
    
    // re-enable start button click
    $("#start_button").on("click", function() {
        start();
        $("#start_button").off("click");
    });
}

// starts timer and adds tacos to gamespace
function start() {
  reverseTimer();
  $("#timer").show();
  addImage();
}

// make tacos reappear

let t;
let imageCount = 0;

function addImage() {
    let x = getX();
    let y = getY();
    let randomTime = Math.floor(Math.random() * 2000);
    let randomRemoveTime = Math.floor(Math.random() * 3000) + 1000;
    
    // give each taco a ID so we can remove it individually
    imageCount++;
    let tacoId = 'taco-' + imageCount;
    
    $("#gamespace").append(`<img src="img/taco.png" alt="big taco" class="taco-img" id="${tacoId}" style="left:${x}px; top:${y}px;">`);
    
    // remove this specific taco after a random time
    setTimeout(function() {
        $('#' + tacoId).fadeOut(300, function() {
            $(this).remove();
        });
    }, randomRemoveTime);
    
    t = setTimeout(addImage, randomTime);
}

</script>

<script>

$(document).ready(function() {

// timer
$("#timer").hide();

// add click event listener
$("#start_button").on("click", function() {
  start();
  $("#start_button").off("click");
})

// make taco clickable
$("#gamespace").on("click", ".taco-img", function() {
    keepScore();
     $(this).fadeOut(300, function() {
        $(this).remove();
    });
});

</script>
